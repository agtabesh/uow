# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping: 1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.24'

    - name: Lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: latest

    - name: Build
      run: go build -v ./...

    - name: Init Mongo replica set
      run: |
        cid=$(docker ps -q --filter "ancestor=mongo:7")
        docker exec "$cid" mongosh --quiet --eval 'rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}]})' || true
        for i in $(seq 1 30); do
          state=$(docker exec "$cid" mongosh --quiet --eval 'rs.status().members[0].stateStr' 2>/dev/null | tr -d '\r')
          echo "member state: $state"
          if [ "$state" = "PRIMARY" ]; then
            echo "replica set ready"
            exit 0
          fi
          sleep 2
        done
        echo "replica set did not become PRIMARY"
        exit 1

    - name: Test
      run: go test -race -v ./...
      env:
        MONGODB_URI: mongodb://localhost:27017/?replicaSet=rs0
